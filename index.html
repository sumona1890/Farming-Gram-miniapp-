<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farming Gram</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  body {
    background: #111827;
    color: white;
    min-height: 100vh;
  }

  .app {
    max-width: 500px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-top: 10px;
    font-size: 28px;
  }

  .subtitle {
    text-align: center;
    color: #9ca3af;
    margin: 8px 0 25px;
  }

  .balance {
    background: #1f2937;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    margin-bottom: 20px;
  }

  .balance h2 {
    font-size: 32px;
    color: #fbbf24;
    margin-top: 10px;
  }

  .mining-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 15px;
    background: #22c55e;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .mining-btn:active {
    transform: scale(0.98);
  }

  .card {
    background: #1f2937;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card h3 {
    font-size: 17px;
  }

  .card p {
    color: #9ca3af;
    font-size: 13px;
    margin-top: 5px;
  }

  .go-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
  }

  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #1f2937;
    display: flex;
    justify-content: space-around;
    padding: 15px 5px;
  }

  .nav button {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 14px;
  }

  .nav button:first-child {
    color: #22c55e;
  }
</style>
</head>

<body>

<div class="app">

  <h1>🌾 Farming Gram</h1>
  <p class="subtitle">Mine coins and earn rewards</p>

  <div class="balance">
    <p>Your Balance</p>
    <h2 id="balance">0 GRAM</h2>
  </div>

  <button class="mining-btn" onclick="startMining()">
    ⛏ START MINING
  </button>

  <div class="card">
    <div>
      <h3>🎁 Daily Bonus</h3>
      <p>Claim your daily reward</p>
    </div>
    <button class="go-btn" onclick="claimBonus()">Claim</button>
  </div>

  <div class="card">
    <div>
      <h3>✅ Tasks</h3>
      <p>Complete tasks and earn coins</p>
    </div>
    <button class="go-btn">Open</button>
  </div>

  <div class="card">
    <div>
      <h3>👥 Invite Friends</h3>
      <p>Earn rewards from referrals</p>
    </div>
    <button class="go-btn">Invite</button>
  </div>

  <div class="card">
    <div>
      <h3>💰 Withdrawal</h3>
      <p>Convert GRAM to USDT</p>
    </div>
    <button class="go-btn">Withdraw</button>
  </div>

</div>

<div class="nav">
  <button>🏠 Home</button>
  <button>📋 Tasks</button>
  <button>👥 Friends</button>
  <button>👤 Profile</button>
</div>

<script>
let balance = 0;
let mining = false;

function startMining() {
  if (mining) {
    alert("Mining is already running!");
    return;
  }

  mining = true;
  alert("Mining started!");

  setInterval(function() {
    balance += 1;
    document.getElementById("balance").innerText = balance + " GRAM";
  }, 5000);
}

function claimBonus() {
  balance += 10;
  document.getElementById("balance").innerText = balance + " GRAM";
  alert("You received 10 GRAM!");
}
</script>

</body>
  </html>
